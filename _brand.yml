meta:
  name: "Livro Online FCG"

# _brand.yml
color:
  palette:
    # ---- Cores do livro ----
    # Os papéis de cor do site e dos applets (styles/tokens.scss)
    # usam só estas cores. Cor nova aqui entra por decisão, depois de medidos
    # o contraste e a legibilidade com daltonismo (diretrizes-tecnicas.md, §6).
    # Os nomes passaram para o inglês em 2026-11-25, os mesmos do livro-base, com os
    # mesmos valores: tests/fixtures/livro-colors.json guarda a tabela dos nomes de
    # antes e de agora, e tests/unit/palette.test.mjs confere que nenhuma cor se perdeu.
    sand-0: "#FCFBF9"
    sand-1: "#FBFAF6"
    sand-2: "#F7F4ED"
    sand-3: "#EFE7D8"

    white-1: "#FFFFFF"
    white-2: "#FAFAFA"
    white-3: "#F3F4F6"

    graphite-1: "#334155"
    graphite-2: "#1F2933"
    graphite-3: "#111827"

    gray-2: "#5B677A"
    gray-5: "#64748B"
    gray-6: "#475569"

    blue-1: "#3B79A8"
    blue-2: "#1E5B8A"
    blue-3: "#153F60"
    blue-5: "#5B7C99"
    blue-8: "#1D4ED8"

    green-2: "#276749"

    amber-2: "#946200"
    amber-3: "#6B4700"

    orange-2: "#B45309"

    red-6: "#991B1B"

    # ---- Cores de teste (do JSX-quarto) ----
    # As paletas comparadas no JSX-quarto, com os nomes de lá: <matiz>-<fonte>,
    # com o nome oficial no comentário quando é outro. Fontes:
    #   ds Desmos · oi Okabe–Ito · tb Tol Bright · tm Tol Muted · td Tol Dark
    #   cb IBM Carbon · d2 ColorBrewer Dark2
    # Os neutros do JSX-quarto (white-1, sand-0, sand-1, sand-2, graphite-1,
    # gray-5) são as cores do livro acima, com os mesmos valores.
    # Servem aos testes: um applet as usa por paleta("<nome>"), de
    # applets-src/src/cores.js, e o verificador avisa se um applet publicado
    # fizer isso. Abaixo de 3:1 sobre o branco, servem só a preenchimentos:
    # yellow-oi, grey-tm, yellow-tm, cyan-tm, cyan-tb, grey-tb, yellow-tb,
    # yellow-d2, orange-oi, cyan-oi, orange-ds, teal-tm e green-d2.
    # Nenhuma cor pode ter só o nome de uma cor do Bootstrap (blue, red, green…):
    # o Quarto a usaria no tema do site inteiro.

    # Desmos (Desmos.Colors)
    red-ds:    "#C74440"
    blue-ds:   "#2D70B3"
    green-ds:  "#388C46"
    purple-ds: "#6042A6"
    orange-ds: "#FA7E19"
    black-ds:  "#000000"

    # Okabe–Ito (JXG.paletteWong)
    orange-oi:  "#E69F00"
    cyan-oi:    "#56B4E9"   # skyblue
    teal-oi:    "#009E73"   # bluishgreen
    yellow-oi:  "#F0E442"
    blue-oi:    "#0072B2"
    red-oi:     "#D55E00"   # vermillion
    magenta-oi: "#CC79A7"   # reddishpurple
    black-oi:   "#000000"

    # Paul Tol Bright
    blue-tb:   "#4477AA"
    cyan-tb:   "#66CCEE"
    green-tb:  "#228833"
    yellow-tb: "#CCBB44"
    red-tb:    "#EE6677"
    purple-tb: "#AA3377"
    grey-tb:   "#BBBBBB"

    # Paul Tol Muted
    blue-tm:        "#332288"   # indigo
    cyan-tm:        "#88CCEE"
    teal-tm:        "#44AA99"
    green-tm:       "#117733"
    yellow-dark-tm: "#999933"   # olive
    yellow-tm:      "#DDCC77"   # sand
    pink-tm:        "#CC6677"   # rose
    red-tm:         "#882255"   # wine
    magenta-tm:     "#AA4499"   # purple
    grey-tm:        "#DDDDDD"   # pale-grey

    # Paul Tol Dark
    blue-td:   "#222255"
    cyan-td:   "#225555"
    green-td:  "#225522"
    yellow-td: "#666633"
    red-td:    "#663333"
    grey-td:   "#555555"

    # IBM Carbon
    purple-cb:       "#6929C4"   # purple-70
    purple-light-cb: "#A56EFF"   # purple-50
    cyan-cb:         "#1192E8"   # cyan-50
    teal-cb:         "#005D5D"   # teal-70
    teal-light-cb:   "#009D9A"   # teal-50
    magenta-cb:      "#9F1853"   # magenta-70
    pink-cb:         "#EE538B"   # magenta-50
    red-cb:          "#FA4D56"   # red-50
    red-dark-cb:     "#570408"   # red-90
    green-cb:        "#198038"   # green-60
    blue-cb:         "#002D9C"   # blue-80
    blue-dark-cb:    "#012749"   # cyan-90
    yellow-cb:       "#B28600"   # yellow-50
    orange-cb:       "#8A3800"   # orange-70

    # ColorBrewer Dark2 (sem nomes oficiais: o número entre parênteses)
    teal-d2:    "#1B9E77"   # 1
    orange-d2:  "#D95F02"   # 2
    purple-d2:  "#7570B3"   # 3
    magenta-d2: "#E7298A"   # 4
    green-d2:   "#66A61E"   # 5
    yellow-d2:  "#E6AB02"   # 6
    brown-d2:   "#A6761D"   # 7
    grey-d2:    "#666666"   # 8

  # Cores semânticas do tema
  foreground: graphite-2
  background: sand-1
  
  primary: blue-2
  secondary: gray-6 # blue-5
  tertiary: sand-2
  link: blue-2

  success: green-2
  info: blue-2
  warning: amber-2
  danger: red-6

  light: white-1
  dark: graphite-2

typography:
  # As fontes vêm com o site (vendor/fonts/, com as licenças; vendor/VERSIONS.md), e
  # não do Google, que recebia o endereço de cada visita. Só o recorte latino e só as
  # faces que as páginas usam: no texto, Atkinson Hyperlegible 400 e 700, normal e
  # itálico; nos títulos, Source Serif 4 600, e 700 para um negrito num título.
  # Os mesmos arquivos do livro-base.
  fonts:
    - family: Atkinson Hyperlegible
      source: file
      files:
        - { path: vendor/fonts/atkinson-hyperlegible-latin-400-normal.woff2, weight: 400, style: normal }
        - { path: vendor/fonts/atkinson-hyperlegible-latin-400-italic.woff2, weight: 400, style: italic }
        - { path: vendor/fonts/atkinson-hyperlegible-latin-700-normal.woff2, weight: 700, style: normal }
        - { path: vendor/fonts/atkinson-hyperlegible-latin-700-italic.woff2, weight: 700, style: italic }
    - family: Source Serif 4
      source: file
      files:
        - { path: vendor/fonts/source-serif-4-latin-600-normal.woff2, weight: 600, style: normal }
        - { path: vendor/fonts/source-serif-4-latin-700-normal.woff2, weight: 700, style: normal }

  # O tamanho e a entrelinha do texto, só aqui: até 2026-11-25, este arquivo dizia
  # 1.0625rem e 1.6, e assets/css/custom.scss, que prevalecia, 1.05rem e 1.65.
  base:
    family: Atkinson Hyperlegible
    size: 1.05rem
    weight: 400
    line-height: 1.65

  headings:
    family: Source Serif 4
    weight: 600
    # Era blue-5: 4.2:1 sobre a página, abaixo dos 4.5:1 que um título menor que 24 px
    # precisa. gray-5 é a cor mais próxima da paleta acima disso (decisão D8 do
    # livro-base, de 2026-11-10; aqui desde 2026-11-25).
    color: gray-5
    line-height: 1.25

  link:
    color: blue-2
    decoration: underline

