<script>
/* O menu recolhido (o modo de leitura do Quarto) vale antes de a página aparecer:
   styles/page.scss leva o texto para o meio, e a página não pisca com o menu aberto. */
try {
  if (localStorage.getItem('quarto-reader-mode') === 'true') document.documentElement.dataset.reader = 'on';
} catch {}
</script>
