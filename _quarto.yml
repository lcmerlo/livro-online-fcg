project:
  type: book
  output-dir: docs

lang: pt-BR
brand: _brand.yml
shortcodes:
  - components/applet.lua

format:
  html:
    theme:
      - cosmo
      - brand
      - assets/css/custom.scss
    toc: true
    toc-location: left
    toc-title: "Neste capítulo"
    toc-depth: 2
    toc-expand: 1
    number-sections: true
    number-depth: 2
    smooth-scroll: true
    callout-appearance: simple
    axe: true
    filters:
      - components/blocos.lua
    include-before-body: components/macros.html


execute:
  echo: false
  warning: false
  error: false

crossref:
  custom:
    - key: exrr
      kind: float
      reference-prefix: Exercício Resolvido
      caption-prefix: "Exercício Resolvido"
      caption-location: top


book:
  title: "Fundamentos de Cálculo e Geometria"
  author: "Projeto FCG"
  date: today
  reader-mode: true
  page-navigation: true
  search:
    location: navbar
    type: overlay
  chapters:
    - index.qmd
    #- _interno/diretrizes/relatorio-design-pedagogico-26-05-14.qmd
    #- _interno/diretrizes/biblioteca-estruturas-site-diretrizes.qmd
    - capitulos/primeiras-nocoes.qmd
    - capitulos/segmentos.qmd
    - capitulos/segmentos-orientados.qmd
    - capitulos/eixos.qmd
    - capitulos/coordenadas-plano.qmd
    - capitulos/circulos.qmd
    - capitulos/vetores.qmd
    - capitulos/produto-numero-vetor.qmd
    - capitulos/soma-subtracao-vetores.qmd
    - capitulos/combinacao-linear.qmd
    - capitulos/produto-interno-escalar.qmd
    - capitulos/projecao-ortogonal.qmd
    - capitulos/area-triangulos-paralelogramos.qmd
    - capitulos/equacao-parametrica-reta.qmd
    - capitulos/equacao-cartesiana-reta.qmd
    - capitulos/intersecao-retas.qmd
    - capitulos/posicao-relativa-retas.qmd
    - capitulos/distancia-ponto_reta-reta_reta.qmd
    - capitulos/posicoes-relativas-reta-circulo.qmd
    - capitulos/posicao-relativa-circulos.qmd
