meta:
  name: "Livro Online FCG"

# _brand.yml
color:
  palette:
    areia-0: "#FCFBF9"
    areia-1: "#FBFAF6"
    areia-2: "#F7F4ED"
    areia-3: "#EFE7D8"

    branco-1: "#FFFFFF"
    branco-2: "#FAFAFA"
    branco-3: "#F3F4F6"

    grafite-1: "#334155"
    grafite-2: "#1F2933"
    grafite-3: "#111827"

    cinza-1: "#7C8798"
    cinza-2: "#5B677A"
    cinza-3: "#3F4A5A"
    cinza-4: "#94A3B8"
    cinza-5: "#64748B"
    cinza-6: "#475569"

    azul-1: "#3B79A8"
    azul-2: "#1E5B8A"
    azul-3: "#153F60"
    azul-4: "#7996AE"
    azul-5: "#5B7C99"
    azul-6: "#425B71"
    azul-7: "#3B82F6"
    azul-8: "#1D4ED8"
    azul-9: "#1E40AF"

    verde-1: "#3F8C67"
    verde-2: "#276749"
    verde-3: "#1B4C36"
    verde-4: "#14A399"
    verde-5: "#0F766E"
    verde-6: "#0B5E58"

    roxo-1: "#A78BFA"
    roxo-2: "#7C3AED"
    roxo-3: "#5B21B6"

    ambar-1: "#B77A12"
    ambar-2: "#946200"
    ambar-3: "#6B4700"

    laranja-1: "#D97706"
    laranja-2: "#B45309"
    laranja-3: "#92400E"

    vermelho-1: "#C34848"
    vermelho-2: "#9F2D2D"
    vermelho-3: "#7A2222"
    vermelho-4: "#DC2626"
    vermelho-5: "#B91C1C"
    vermelho-6: "#991B1B"

  # Cores semânticas do tema
  foreground: grafite-2
  background: areia-1
  
  primary: azul-2
  secondary: cinza-6 # azul-5
  tertiary: areia-2
  link: azul-2

  success: verde-2
  info: azul-2
  warning: ambar-2
  danger: vermelho-2

  light: branco-1
  dark: grafite-2


typography:
  #fonts:
  #  - family: Atkinson Hyperlegible
  #    source: google
  #  - family: Source Serif 4
  #    source: google
  #base: Atkinson Hyperlegible
  #headings: Source Serif 4
  #
  fonts:
    - family: Atkinson Hyperlegible
      source: google
      weight: [400, 700]
      display: swap

    - family: Source Serif 4
      source: google
      weight: [400, 600, 700]
      display: swap

  base:
    family: Atkinson Hyperlegible
    size: 1.0625rem
    weight: 400
    line-height: 1.6

  headings:
    family: Source Serif 4
    weight: 600
    color: azul-5  # grafite-2
    line-height: 1.25

  link:
    color: azul-2
    decoration: underline

