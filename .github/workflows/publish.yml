name: Renderiza e publica site Quarto

# Push na main: verifica e publica. Pull request para a main: só verifica,
# para que um erro apareça antes da integração.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publicações: uma por vez, a mais recente vence. Pull requests: grupo próprio
# de cada branch, para não interromper uma publicação.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verificacao-{0}', github.head_ref) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: applets-src/package-lock.json

      - name: Instalar dependências dos applets
        working-directory: applets-src
        run: npm ci

      - name: Gerar applets
        working-directory: applets-src
        run: npm run build

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.35

      - name: Renderizar site HTML
        run: quarto render --to html

      - name: Verificar fontes e HTML gerado
        run: node tests/verificar-site.mjs

      - name: Verificar links internos e âncoras
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress 'docs/**/*.html'
          fail: true

      - name: Enviar artefato para GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4