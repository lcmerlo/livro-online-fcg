project:
  type: book
  output-dir: docs
  # O que as páginas carregam e o Quarto não copia sozinho: o script de toda página
  # (src/site/*.js; apply-prefs.html vai dentro de cada página) e o KaTeX, que vem com
  # o site (vendor/VERSIONS.md). A barra inicial prende o padrão à raiz: sem ela, o
  # padrão vale em qualquer subpasta, e o render do perfil lab levaria docs/vendor/
  # para dentro de docs-lab/.
  resources:
    - /src/site/*.js
    - /vendor/katex/**
  # Depois de gerar as páginas: as fórmulas são desenhadas, uma vez, e não no
  # navegador de cada leitor; e as seções de cada capítulo entram no menu lateral.
  post-render:
    - tools/prerender-math.ts
    - tools/sidebar-sections.ts

lang: pt-BR
# Só o tema claro: com `brand: _brand.yml`, o Quarto gera também uma folha escura,
# que toda página baixava (69 KB pela rede) e que nenhuma usava: o site não tem botão
# de tema escuro, e a página fica clara mesmo com o sistema em modo escuro.
brand:
  light: _brand.yml
shortcodes:
  - components/applet.lua

format:
  html:
    # O tema: o Cosmo, as cores e as fontes de _brand.yml, e as folhas do livro, nesta
    # ordem: as cores pelo que significam, a página, os blocos, as fórmulas comentadas e
    # o sistema antigo de applets (sai na fase 5 da migração).
    theme:
      - cosmo
      - brand
      - styles/tokens.scss
      - styles/page.scss
      - styles/blocks.scss
      - styles/annotations.scss
      - styles/old-applets.scss
    # As larguras da página, num só lugar: o menu, a coluna de texto (que continua boa
    # de ler em tela grande) e a coluna da direita, para os applets largos
    # (.column-page-right) que vêm com os applets novos. A grade que usa estes números
    # está em styles/page.scss (decisões E4 e E8 do livro-base).
    grid:
      sidebar-width: 200px
      body-width: 720px
      margin-width: 240px
      gutter-width: 1.5rem
    # Sem a coluna "Neste capítulo": as seções ficam no menu lateral, como subitens de
    # cada capítulo (tools/sidebar-sections.ts).
    toc: false
    number-sections: true
    number-depth: 2
    smooth-scroll: true
    # A verificação de acessibilidade (axe) fica no perfil `axe` (_quarto-axe.yml),
    # fora do site publicado.
    # Fórmulas: o KaTeX de vendor/katex/, que vem com o site, e não de outro
    # servidor; o verificador desenha as fórmulas com o mesmo arquivo. O caminho é
    # relativo à página: as páginas de uma pasta (capitulos/, laboratorio/) sobem um
    # nível, no _metadata.yml de cada pasta.
    html-math-method:
      method: katex
      url: "vendor/katex/"
    # O menu recolhido vale antes de a página aparecer; sem JavaScript, dicas e soluções
    # ficam à vista.
    include-in-header: src/site/apply-prefs.html
    filters:
      - components/applet-bloco.lua


# Blocos do capítulo (filters/blocks.lua): dicas e soluções em abas que se recolhem
# (decisões D6 e E2 do livro-base); o rótulo de um bloco na linha do texto, como
# "Definição 1.1" (E3). Os outros valores: reveal: inline | steps | accordion;
# block-labels: above.
reveal: tabs
block-labels: run-in

# Para qualquer formato de saída: as macros do livro (\vet, \norm, \R…), de
# math/macros.json, expandidas em toda fórmula, que chega ao KaTeX, às prévias das
# referências e ao PDF já em TeX comum; as fórmulas comentadas; e os blocos. O filtro
# dos blocos roda antes do Quarto (`at: pre-ast`): o Quarto tem um ambiente .solution
# próprio, que deixaria a solução à vista, sem aba (decisão E15 do livro-base); com
# isso, ele roda também antes dos outros. Em toda página HTML, o que roda em toda
# página (src/site/boot.js).
filters:
  - filters/macros.lua
  - filters/annotations.lua
  - path: filters/blocks.lua
    at: pre-ast
  - filters/site.lua

execute:
  echo: false
  warning: false
  error: false

book:
  title: "Fundamentos de Cálculo e Geometria"
  author: "Projeto FCG"
  date: today
  reader-mode: true
  page-navigation: true
  # Faixa no alto de todas as páginas enquanto o livro está em testes; sai na
  # divulgação ao público-alvo (pendencias.md, §6). Fica em `book`: desde o
  # Quarto 1.11, um livro ignora a de `website` (no 1.9.35, era o contrário).
  announcement:
    content: "**Material em construção.** Uso não recomendado no momento!"
    type: warning
    dismissable: false
  search:
    location: navbar
    type: overlay
  # O cabeçalho, como no livro-base (decisão E4): o ícone que recolhe o menu, o título
  # e a lupa da busca, que sem ele não aparecia em lugar nenhum.
  navbar:
    background: light
    collapse: false
    search: true
  sidebar:
    style: floating
    collapse-level: 1
  chapters:
    - index.qmd
    #- _interno/referencia/relatorio-design-pedagogico-26-05-14.qmd
    #- _interno/referencia/biblioteca-estruturas-site-diretrizes.qmd
    # Os 20 capítulos de antes, protótipos, estão em _interno/oficina/nao-publicados/,
    # como modelo para os novos, que entram aqui (2026-11-22).
    # O perfil lab (_quarto-lab.yml) acrescenta a parte Laboratório no fim desta lista.
