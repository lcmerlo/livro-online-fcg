# Projeto local para testes com a mesma configuração do livro publicado.
# Renderizar: quarto render _interno/oficina/testes/ARQUIVO.qmd
# O HTML é gerado ao lado do .qmd e não é versionado (.gitignore).
#
# Os campos abaixo repetem lang, brand, shortcodes, format, execute e
# crossref de /_quarto.yml, com caminhos relativos à raiz do repositório.
# Ao alterar /_quarto.yml, atualize também este arquivo.

project:
  type: default

lang: pt-BR
language: ../../../_language.yml
brand: ../../../_brand.yml
shortcodes:
  - ../../../components/applet.lua

format:
  html:
    theme:
      - cosmo
      - brand
      - ../../../assets/css/custom.scss
    toc: true
    toc-location: left
    toc-title: "Neste capítulo"
    toc-depth: 2
    toc-expand: 1
    number-sections: true
    number-depth: 2
    smooth-scroll: true
    callout-appearance: simple
    axe: true
    filters:
      - ../../../components/blocos.lua
      - ../../../components/applet-bloco.lua
    include-before-body: ../../../components/macros.html

execute:
  echo: false
  warning: false
  error: false

crossref:
  custom:
    - key: exrr
      kind: float
      reference-prefix: Exercício Resolvido
      caption-prefix: "Exercício Resolvido"
      caption-location: top
