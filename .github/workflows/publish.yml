name: Renderiza e publica site Quarto

# Push na main: verifica e publica. Pull request para a main: só verifica,
# para que um erro apareça antes da integração.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publicações: uma por vez, a mais recente vence. Pull requests: grupo próprio
# de cada branch, para não interromper uma publicação.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verificacao-{0}', github.head_ref) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      # Os applets são servidos como estão, sem compilação: o Node só roda os testes.
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # O padrão entre aspas: o Node 22 não aceita uma pasta, e quem expande o padrão é
      # ele, e não o shell.
      - name: Testes de unidade
        run: node --test "tests/unit/*.test.mjs"

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Renderizar site HTML
        run: quarto render --to html

      # Também os links internos e as âncoras (antes, à parte, pelo lychee).
      - name: Verificar fontes e site gerado
        run: node tests/check-site.mjs

      # O laboratório (_quarto-lab.yml) não é publicado, mas, se ele não renderizar ou não
      # passar na verificação, a publicação para: é onde tema, filtros e applets se
      # conferem enquanto não há capítulos. Só as fórmulas de teste.qmd (o experimento das
      # setas) são listadas, sem reprovar.
      - name: Renderizar o laboratório
        run: quarto render --profile lab --to html

      - name: Verificar o laboratório
        run: node tests/check-site.mjs --lab

      - name: Enviar artefato para GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4