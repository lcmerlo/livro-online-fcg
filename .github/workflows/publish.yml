name: Renderiza e publica site Quarto

# Push na main: verifica e publica. Pull request para a main: só verifica,
# para que um erro apareça antes da integração.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publicações: uma por vez, a mais recente vence. Pull requests: grupo próprio
# de cada branch, para não interromper uma publicação.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verificacao-{0}', github.head_ref) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      # Os applets são servidos como estão, sem compilação: o Node só roda os testes de
      # unidade e o verificador.
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # O padrão entre aspas: o Node 22 não aceita uma pasta, e quem expande o padrão é
      # ele, e não o shell.
      - name: Testes de unidade
        run: node --test "tests/unit/*.test.mjs"

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Renderizar site HTML
        run: quarto render --to html

      - name: Verificar fontes e HTML gerado
        run: node tests/verificar-site.mjs

      - name: Verificar links internos e âncoras
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress 'docs/**/*.html'
          fail: true

      # O laboratório (_quarto-lab.yml) não é publicado, mas, se ele não renderizar, a
      # publicação para: é onde tema, filtros e applets se conferem enquanto não há
      # capítulos. O que o verificador acha nas páginas dele é listado, sem reprovar.
      - name: Renderizar o laboratório
        run: quarto render --profile lab --to html

      - name: Verificar o laboratório
        run: node tests/verificar-site.mjs --lab

      - name: Enviar artefato para GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4