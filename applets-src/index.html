<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Applets — página de desenvolvimento</title>
  <style>
    /* Cores lidas por src/cores.js; no livro vêm de assets/css/custom.scss. */
    :root {
      --cor-texto: #1f2933;
      --cor-superf: #fafafa;

      --cor-obj-princ-suave: #3b82f6;
      --cor-obj-princ: #1d4ed8;
      --cor-obj-princ-forte: #1e40af;

      --cor-manip-suave: #14a399;
      --cor-manip: #0f766e;
      --cor-manip-forte: #0b5e58;

      --cor-constr-suave: #a78bfa;
      --cor-constr: #7c3aed;
      --cor-constr-forte: #5b21b6;

      --cor-aux-suave: #94a3b8;
      --cor-aux: #64748b;
      --cor-aux-forte: #475569;

      --cor-invar-suave: #d97706;
      --cor-invar: #b45309;
      --cor-invar-forte: #92400e;

      --cor-erro-suave: #dc2626;
      --cor-erro: #b91c1c;
      --cor-erro-forte: #991b1b;
    }
    body { font-family: sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
    .applet-jxg { width: 100%; max-width: 640px; aspect-ratio: 4 / 3; }
  </style>
</head>
<body>
  <h1>Applets — desenvolvimento</h1>
  <p>Use <code>npm run dev</code>. Cada applet novo entra aqui como no livro: um <code>div</code> com <code>data-applet</code> e <code>id</code>.</p>

  <div id="jxg-segmento-dev" class="applet-jxg" data-applet="segmento"
       aria-label="Applet interativo sobre segmento com dois pontos móveis."></div>
  <p id="jxg-segmento-dev-status" role="status" aria-live="polite"></p>
  <button type="button" data-reset="jxg-segmento-dev">Reiniciar applet</button>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
